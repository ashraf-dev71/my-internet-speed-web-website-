<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NetPulse - Internet Speed Test & Network Utility</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect
      var l = window.location;
      var pathSegments = l.pathname.split('/').filter(Boolean);
      var isGitHubSubfolder = l.hostname.endsWith('github.io') && pathSegments.length > 0;
      var repoPrefix = isGitHubSubfolder ? '/' + pathSegments[0] : '';
      window.location.replace(repoPrefix + '/');
    </script>
  </head>
  <body>
    <p>Redirecting to NetPulse Speed Test...</p>
  </body>
</html>
